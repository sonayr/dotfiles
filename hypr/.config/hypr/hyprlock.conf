# Hyprlock configuration with Song of Time listener indicator

background {
    monitor =
    path = ~/.config/hypr/ocarina.jpg
    blur_passes = 2
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(26, 26, 26, 0.8)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <span foreground="##a0a0a0">Enter Password...</span>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Current Time
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(240, 240, 240, 0.9)
    font_size = 55
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgba(200, 200, 200, 0.75)
    font_size = 18
    font_family = monospace
    position = 0, 40
    halign = center
    valign = center
}

# Subtle Song of Time listener indicator
label {
    monitor =
    text = cmd[update:500] song-of-time-status
    color = rgba(130, 210, 255, 0.85)
    font_size = 14
    font_family = monospace
    position = 0, -90
    halign = center
    valign = center
}
